# LineSight – infrastruktura na laptopie (etap 3).
# Start:  docker compose -f infra/docker-compose.yml up -d
# Stop:   docker compose -f infra/docker-compose.yml down
# Grafana: http://localhost:3000 (admin / hasło z GRAFANA_PASSWORD, domyślnie linesight).
name: linesight

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: linesight-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT bez TLS – tylko sieć domowa
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data   # E4-01: kolejki, sesje i retained przeżywają restart brokera

  bridge:   # E3-05: most OPC UA (sterownik) -> MQTT
    build: ../bridge
    container_name: linesight-bridge
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      OPCUA_URL: ${OPCUA_URL:-opc.tcp://192.168.0.244:4840}   # E7-02: inny sterownik: set OPCUA_URL=... przed up
      MQTT_HOST: mosquitto   # nazwa usługi w sieci compose

  db:   # E3-06: TimescaleDB (PostgreSQL 17 z rozszerzeniem szeregów czasowych)
    image: timescale/timescaledb:2.25.2-pg17
    container_name: linesight-db
    restart: unless-stopped
    ports:
      - "5432:5432"   # dla psql / DBeavera z laptopa; Grafana łączy się wewnątrz sieci compose
    environment:
      POSTGRES_DB: linesight
      POSTGRES_USER: linesight
      POSTGRES_PASSWORD: ${PG_PASSWORD:-linesight}   # lokalnie; inne hasło: zmienna PG_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data              # dane przeżywają `docker compose down`
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-linesight.sql:ro   # schemat, tylko przy pustym wolumenie
      - ./db/20-grafana-ro.sql:/docker-entrypoint-initdb.d/20-grafana-ro.sql:ro
      - ./db/30-diag.sql:/docker-entrypoint-initdb.d/30-diag.sql:ro
      - ./db/31-drive-health.sql:/docker-entrypoint-initdb.d/31-drive-health.sql:ro
      - ./db/40-kb.sql:/docker-entrypoint-initdb.d/40-kb.sql:ro   # E5-01: pgvector, kb_chunk
      - ./db/50-vision-stats.sql:/docker-entrypoint-initdb.d/50-vision-stats.sql:ro   # E6-07: sygnał dryfu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linesight -d linesight"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:   # E3-06: MQTT -> TimescaleDB
    build: ../ingest
    container_name: linesight-ingest
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      DB_DSN: postgresql://linesight:${PG_PASSWORD:-linesight}@db:5432/linesight

  diag:   # E4-02: postoje linii (stop_event) z historii stanu PackML; E4-08: kondycja napędu (drive_health)
    build:
      context: ..                  # główny folder repo: wspólny kod cech z anomaly/
      dockerfile: diag/Dockerfile
    container_name: linesight-diag
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: postgresql://linesight:${PG_PASSWORD:-linesight}@db:5432/linesight
      CLIP_URL: http://192.168.0.124:8080/   # E4-04: serwer klipów na Jetsonie
      DRIVE_MODEL: /models/drive_ae.onnx     # E4-08: z anomaly/model.py (pliki modelu poza repo)
    volumes:
      - ../models:/models:ro

  assistant:   # E5-08: asystent RAG (FastAPI) – http://localhost:8000; link „Zapytaj asystenta” w tabeli postojów
    build:
      context: ..
      dockerfile: assistant/Dockerfile
    container_name: linesight-assistant
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_DSN: postgresql://linesight:${PG_PASSWORD:-linesight}@db:5432/linesight
      LLM_BACKEND: ${LLM_BACKEND:-ollama}            # ollama (lokalnie, domyślnie) | gemini
      OLLAMA_URL: http://host.docker.internal:11434   # Ollama działa na Windowsie (GPU), nie w kontenerze
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}             # z zmiennej środowiskowej Windows (setx), nie z repo
    extra_hosts:
      - "host.docker.internal:host-gateway"           # Docker Desktop ma tę nazwę wbudowaną; to dla Dockera na Linuksie
    volumes:
      - hf-cache:/hf

  tokens:   # E6-03: broker krótkotrwałych tokenów GCP dla Jetsona (impersonation konta jetson-edge, bez klucza JSON)
    build: ../cloud
    container_name: linesight-tokens
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      BROKER_SECRET: ${BROKER_SECRET:-}   # zmienna Windows (setx), nie w repo; bez niej broker się nie uruchomi
      TARGET_SA: jetson-edge@linesight-514914.iam.gserviceaccount.com
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ${APPDATA}/gcloud:/gcloud:ro   # ADC z `gcloud auth application-default login` (konto użytkownika)

  grafana:   # E3-07: dashboard linii (źródło danych i dashboard z plików, provisioning)
    image: grafana/grafana:13.2.4
    container_name: linesight-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-linesight}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/linesight.json
      # E5-08: panel tekstowy z iframe asystenta (http://localhost:8000). Wyłączona sanityzacja HTML pozwala na <iframe>
      # i skrypty w panelach – akceptowalne lokalnie (jeden użytkownik, sieć domowa), NIE na współdzielonej Grafanie.
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  hf-cache:
  mosquitto-data:
  pgdata:
  grafana:
