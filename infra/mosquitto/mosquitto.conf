# Mosquitto 2.x bez pliku konfiguracyjnego słucha tylko na localhost
# i odrzuca klientów bez hasła. Jetson łączy się z sieci LAN, więc:
listener 1883 0.0.0.0
allow_anonymous true

# E4-01: trwałość. Kolejki sesji trwałych (ingest), same sesje i wiadomości retained
# zapisywane do /mosquitto/data/mosquitto.db (wolumen mosquitto-data w docker-compose.yml).
# Zapis: przy zatrzymaniu brokera (docker stop/restart) i co autosave_interval sekund
# (domyślnie 1800 – przy twardym zabiciu kontenera przepadłoby do 30 min kolejki).
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# E4-01: kolejka na klienta. Domyślnie 1000 wiadomości QoS 1 – przy ok. 120 wiadomościach/min
# ingest wyłączony na > 8 min gubił nadmiar. 100 000 ≈ 14 h przerwy, kilkanaście MB RAM.
# Wiadomości ponad limit broker po cichu odrzuca (i nie zapisuje ich w mosquitto.db).
max_queued_messages 100000

log_dest stdout
